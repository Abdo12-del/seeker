services:
  seeker:
    build: .
    image: seeker:2.0
    ports:
      - "8080:8080"
    environment:
      SEEKER_ORG: "Security Awareness Team"
      SEEKER_CONTACT: "soc@example.org"
      SEEKER_LANG: "ar"
      SEEKER_PRECISION: "geohash"
      SEEKER_RETENTION_DAYS: "30"
      SEEKER_TOKEN: "${SEEKER_TOKEN:-change-me}"
      SEEKER_BASE_URL: "${SEEKER_BASE_URL:-http://localhost:8080}"
    volumes:
      - seeker-data:/data
    restart: unless-stopped

volumes:
  seeker-data:
